  92%,96% { transform: rotate(calc(-360deg / 13 * 12)) }
  100% { transform: rotate(calc(-360deg / 13 * 13)) }
}
.rotate-counter-clockwise { transform-origin: center; animation: rotateCounterClockwise 10s 0s ease-in-out infinite; }
