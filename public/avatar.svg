<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
<defs>
  <radialGradient id="bg" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#111111"/>
    <stop offset="100%" stop-color="#0a0a0a"/>
  </radialGradient>
  <linearGradient id="hood" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#1a1a1a"/>
    <stop offset="100%" stop-color="#0a0a0a"/>
  </linearGradient>
  <linearGradient id="face" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#e5e7eb"/>
    <stop offset="100%" stop-color="#9ca3af"/>
  </linearGradient>
  <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ef4444"/>
    <stop offset="100%" stop-color="#dc2626"/>
  </linearGradient>
  <filter id="glow">
    <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.5"/>
  </filter>
  <filter id="soft-glow">
    <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ef4444" flood-opacity="0.3"/>
  </filter>
  <clipPath id="hex-clip">
    <polygon points="250,40 430,145 430,355 250,460 70,355 70,145"/>
  </clipPath>
</defs>

<style>
  @keyframes hexSpin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
  @keyframes hexSpinReverse { 0%{transform:rotate(360deg)} 100%{transform:rotate(0deg)} }
  @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:0.8} }
  @keyframes dataFlow { 0%{stroke-dashoffset:20} 100%{stroke-dashoffset:0} }
  @keyframes scanline { 0%{transform:translateY(-100%)} 100%{transform:translateY(500px)} }
  .hex-spin { animation: hexSpin 30s linear infinite; transform-origin: 250px 250px; }
  .hex-spin-reverse { animation: hexSpinReverse 24s linear infinite; transform-origin: 250px 250px; }
  .pulse { animation: pulse 3s ease-in-out infinite; }
  .data-flow { stroke-dasharray: 4 4; animation: dataFlow 1s linear infinite; }
</style>

<!-- Background -->
<rect width="500" height="500" fill="url(#bg)"/>

<!-- Outer hex wireframe ring -->
<g class="hex-spin">
  <polygon points="250,20 445,132 445,368 250,480 55,368 55,132" fill="none" stroke="#ef4444" stroke-width="1" stroke-opacity="0.15"/>
  <polygon points="250,35 432,140 432,360 250,465 68,360 68,140" fill="none" stroke="#ef4444" stroke-width="0.5" stroke-opacity="0.1" class="data-flow"/>
</g>

<!-- Mid hex ring with tech segments -->
<g class="hex-spin-reverse">
  <polygon points="250,55 415,152 415,348 250,445 85,348 85,152" fill="none" stroke="#ef4444" stroke-width="2" stroke-opacity="0.25"/>
  <!-- Corner accents -->
  <line x1="250" y1="55" x2="250" y2="75" stroke="#ef4444" stroke-width="3" stroke-opacity="0.6"/>
  <line x1="415" y1="152" x2="400" y2="160" stroke="#ef4444" stroke-width="3" stroke-opacity="0.6"/>
  <line x1="415" y1="348" x2="400" y2="340" stroke="#ef4444" stroke-width="3" stroke-opacity="0.6"/>
  <line x1="250" y1="445" x2="250" y2="425" stroke="#ef4444" stroke-width="3" stroke-opacity="0.6"/>
  <line x1="85" y1="348" x2="100" y2="340" stroke="#ef4444" stroke-width="3" stroke-opacity="0.6"/>
  <line x1="85" y1="152" x2="100" y2="160" stroke="#ef4444" stroke-width="3" stroke-opacity="0.6"/>
</g>

<!-- Inner hex border -->
<polygon points="250,70 400,160 400,340 250,430 100,340 100,160" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-opacity="0.4" filter="url(#soft-glow)"/>

<!-- Clipped content -->
<g clip-path="url(#hex-clip)">
  <!-- Inner glow -->
  <ellipse cx="250" cy="230" rx="160" ry="180" fill="#ef4444" opacity="0.04"/>
  
  <!-- Hood -->
  <path d="M250 80 C180 80, 140 130, 140 185 C140 225, 155 265, 170 300 L170 430 C170 445, 195 460, 250 460 C305 460, 330 445, 330 430 L330 300 C345 265, 360 225, 360 185 C360 130, 320 80, 250 80Z" 
        fill="url(#hood)" stroke="#2a2a2a" stroke-width="0.5"/>
  
  <!-- Hood inner shadow -->
  <path d="M250 95 C195 95, 155 140, 155 185 C155 215, 165 245, 175 275 L175 320 C175 330, 190 340, 250 340 C310 340, 325 330, 325 320 L325 275 C335 245, 345 215, 345 185 C345 140, 305 95, 250 95Z" 
        fill="#0f0f0f" opacity="0.5"/>
  
  <!-- Mask -->
  <ellipse cx="250" cy="210" rx="55" ry="65" fill="url(#face)"/>
  
  <!-- Eyes -->
  <ellipse cx="230" cy="200" rx="13" ry="9" fill="#0a0a0a"/>
  <ellipse cx="270" cy="200" rx="13" ry="9" fill="#0a0a0a"/>
  
  <!-- Eye glow -->
  <ellipse cx="230" cy="200" rx="8" ry="5" fill="#ef4444" opacity="0.8" filter="url(#glow)"/>
  <ellipse cx="270" cy="200" rx="8" ry="5" fill="#ef4444" opacity="0.8" filter="url(#glow)"/>
  
  <!-- Smile -->
  <path d="M225 240 Q250 255 275 240" stroke="#0a0a0a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Cheek lines -->
  <line x1="215" y1="228" x2="222" y2="232" stroke="#d1d5db" stroke-width="0.8" opacity="0.3"/>
  <line x1="285" y1="228" x2="278" y2="232" stroke="#d1d5db" stroke-width="0.8" opacity="0.3"/>
  
  <!-- Scan line effect -->
  <rect x="70" y="0" width="360" height="3" fill="#ef4444" opacity="0.06" style="animation: scanline 4s linear infinite;"/>
  
  <!-- Binary rain inside hex -->
  <text x="110" y="120" font-family="monospace" font-size="9" fill="#ef4444" opacity="0.12">01101001</text>
  <text x="310" y="140" font-family="monospace" font-size="9" fill="#ef4444" opacity="0.1">10110100</text>
  <text x="120" y="400" font-family="monospace" font-size="9" fill="#ef4444" opacity="0.1">11010011</text>
  <text x="320" y="380" font-family="monospace" font-size="9" fill="#ef4444" opacity="0.12">01001101</text>
  <text x="160" y="160" font-family="monospace" font-size="7" fill="#ef4444" opacity="0.08">0xDEADBEEF</text>
  <text x="290" y="350" font-family="monospace" font-size="7" fill="#ef4444" opacity="0.08">0xCAFEBABE</text>
</g>

<!-- Corner tech marks -->
<g stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.5">
  <!-- Top left -->
  <line x1="30" y1="60" x2="30" y2="90"/>
  <line x1="30" y1="60" x2="60" y2="60"/>
  <!-- Top right -->
  <line x1="470" y1="60" x2="470" y2="90"/>
  <line x1="470" y1="60" x2="440" y2="60"/>
  <!-- Bottom left -->
  <line x1="30" y1="440" x2="30" y2="410"/>
  <line x1="30" y1="440" x2="60" y2="440"/>
  <!-- Bottom right -->
  <line x1="470" y1="440" x2="470" y2="410"/>
  <line x1="470" y1="440" x2="440" y2="440"/>
</g>

<!-- Tech readout text -->
<text x="30" y="50" font-family="monospace" font-size="8" fill="#ef4444" opacity="0.4">SYS.ID: 0xCYB3R</text>
<text x="340" y="490" font-family="monospace" font-size="8" fill="#ef4444" opacity="0.4" text-anchor="end">STATUS: ACTIVE</text>

<!-- Small accent dots -->
<circle cx="250" cy="30" r="2" fill="#ef4444" opacity="0.5" class="pulse"/>
<circle cx="460" cy="250" r="2" fill="#ef4444" opacity="0.5" class="pulse" style="animation-delay: 1s"/>
<circle cx="250" cy="470" r="2" fill="#ef4444" opacity="0.5" class="pulse" style="animation-delay: 2s"/>
<circle cx="40" cy="250" r="2" fill="#ef4444" opacity="0.5" class="pulse" style="animation-delay: 0.5s"/>
</svg>
