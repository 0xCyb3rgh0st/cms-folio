<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="mask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
    <filter id="inner-glow">
      <feFlood flood-color="#ef4444" flood-opacity="0.4"/>
      <feComposite in2="SourceGraphic" operator="in"/>
      <feGaussianBlur stdDeviation="2"/>
      <feComposite in="SourceGraphic" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background glow -->
  <ellipse cx="200" cy="200" rx="180" ry="200" fill="url(#glow)"/>
  
  <!-- Hood shape -->
  <path d="M200 40 
           C120 40, 80 100, 80 160 
           C80 200, 90 240, 100 280 
           L100 420 
           C100 440, 120 460, 200 460 
           C280 460, 300 440, 300 420 
           L300 280 
           C310 240, 320 200, 320 160 
           C320 100, 280 40, 200 40Z" 
        fill="url(#hood)" stroke="#2a2a2a" stroke-width="1" filter="url(#shadow)"/>
  
  <!-- Hood inner shadow/fold -->
  <path d="M200 60 
           C140 60, 100 110, 100 160 
           C100 190, 110 220, 120 260
           L120 300
           C120 310, 130 320, 200 320
           C270 320, 280 310, 280 300
           L280 260
           C290 220, 300 190, 300 160
           C300 110, 260 60, 200 60Z" 
        fill="#0f0f0f" opacity="0.6"/>
  
  <!-- Anonymous mask -->
  <ellipse cx="200" cy="180" rx="70" ry="85" fill="url(#mask)" filter="url(#inner-glow)"/>
  
  <!-- Mask features - eyes -->
  <ellipse cx="175" cy="165" rx="18" ry="12" fill="#0a0a0a"/>
  <ellipse cx="225" cy="165" rx="18" ry="12" fill="#0a0a0a"/>
  
  <!-- Eye glow -->
  <ellipse cx="175" cy="165" rx="12" ry="8" fill="#ef4444" opacity="0.6"/>
  <ellipse cx="225" cy="165" rx="12" ry="8" fill="#ef4444" opacity="0.6"/>
  
  <!-- Mask smile -->
  <path d="M170 210 Q200 230 230 210" stroke="#0a0a0a" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Mask cheek lines -->
  <line x1="155" y1="195" x2="165" y2="200" stroke="#d1d5db" stroke-width="1" opacity="0.5"/>
  <line x1="245" y1="195" x2="235" y2="200" stroke="#d1d5db" stroke-width="1" opacity="0.5"/>
  
  <!-- Digital rain accent lines -->
  <line x1="50" y1="100" x2="50" y2="180" stroke="#ef4444" stroke-width="1" opacity="0.15"/>
  <line x1="70" y1="60" x2="70" y2="140" stroke="#ef4444" stroke-width="1" opacity="0.1"/>
  <line x1="330" y1="80" x2="330" y2="160" stroke="#ef4444" stroke-width="1" opacity="0.15"/>
  <line x1="350" y1="120" x2="350" y2="200" stroke="#ef4444" stroke-width="1" opacity="0.1"/>
  
  <!-- Binary/hex accents -->
  <text x="40" y="120" font-family="monospace" font-size="8" fill="#ef4444" opacity="0.2">01101</text>
  <text x="340" y="100" font-family="monospace" font-size="8" fill="#ef4444" opacity="0.2">10010</text>
  <text x="45" y="160" font-family="monospace" font-size="8" fill="#ef4444" opacity="0.15">11010</text>
  <text x="345" y="140" font-family="monospace" font-size="8" fill="#ef4444" opacity="0.15">01101</text>
</svg>
